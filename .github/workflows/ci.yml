name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core library + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore tests/DbvoStudio.Core.Tests/DbvoStudio.Core.Tests.csproj
      - name: Build
        run: dotnet build tests/DbvoStudio.Core.Tests/DbvoStudio.Core.Tests.csproj --no-restore -c Release
      - name: Test
        run: dotnet test tests/DbvoStudio.Core.Tests/DbvoStudio.Core.Tests.csproj --no-build -c Release --logger "console;verbosity=normal"
