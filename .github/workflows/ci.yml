name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core library + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore tests/DbvoStudio.Core.Tests/DbvoStudio.Core.Tests.csproj
      - name: Build
        run: dotnet build tests/DbvoStudio.Core.Tests/DbvoStudio.Core.Tests.csproj --no-restore -c Release
      - name: Test
        run: dotnet test tests/DbvoStudio.Core.Tests/DbvoStudio.Core.Tests.csproj --no-build -c Release --logger "console;verbosity=normal" --logger "GitHubActions;summary-include-passed=false"

  app:
    name: Windows app
    runs-on: windows-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish
        run: dotnet publish src/DbvoStudio.App/DbvoStudio.App.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=false -o publish/DBVO-Studio
      - name: Bundle ffmpeg (LGPL build)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # FFmpeg's LGPL Windows build from BtbN/FFmpeg-Builds (redistributable with its license text).
          # The 'latest' tag is re-created daily; while it is being replaced, fall back to the newest release that has the zip.
          $rel = $null
          try { $rel = gh api repos/BtbN/FFmpeg-Builds/releases/tags/latest | ConvertFrom-Json } catch { }
          if (-not $rel -or -not $rel.assets) {
            $all = gh api "repos/BtbN/FFmpeg-Builds/releases?per_page=10" | ConvertFrom-Json
            $rel = $all | Where-Object { $_.assets | Where-Object { $_.name -match 'win64-lgpl' } } | Select-Object -First 1
          }
          $asset = $rel.assets | Where-Object { $_.name -match '^ffmpeg-n[0-9.]+-latest-win64-lgpl-[0-9.]+\.zip$' } | Sort-Object name -Descending | Select-Object -First 1
          if (-not $asset) { $asset = $rel.assets | Where-Object { $_.name -eq 'ffmpeg-master-latest-win64-lgpl.zip' } | Select-Object -First 1 }
          if (-not $asset) { throw "No LGPL win64 ffmpeg build found" }
          Write-Host "Using $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffx
          $dir = Get-ChildItem ffx -Directory | Select-Object -First 1
          $dest = "publish/DBVO-Studio/Tools/ffmpeg"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item (Join-Path $dir.FullName "bin/ffmpeg.exe") $dest
          Copy-Item (Join-Path $dir.FullName "LICENSE.txt") $dest
          "FFmpeg $($asset.name), unmodified, from $($asset.browser_download_url)`r`nBuilt by https://github.com/BtbN/FFmpeg-Builds (LGPL configuration). Source code: https://ffmpeg.org/download.html and https://github.com/FFmpeg/FFmpeg" | Out-File -Encoding utf8 (Join-Path $dest "SOURCE.txt")
          & (Join-Path $dest "ffmpeg.exe") -hide_banner -version | Select-Object -First 3
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: DBVO-Studio-win-x64
          path: publish/DBVO-Studio
          retention-days: 30
