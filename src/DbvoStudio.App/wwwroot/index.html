<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DBVO Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="top">
      <div class="brand" id="brand" role="button" tabindex="0" title="DBVO Studio: the landing page">
        <span class="logo" aria-hidden="true"></span>
        <div class="brand-name">DBVO Studio</div>
      </div>
      <nav class="crumbs">
        <button class="crumb" data-section="mods" title="Read a mod's plugins and choose which player lines to voice"><span class="num">1</span><span>Phase 1<span class="crumb-more">: Import Mods</span></span></button>
        <span class="crumb-sep">›</span>
        <button class="crumb" data-section="patches" title="Generate, review and export the voice files of each mod"><span class="num">2</span><span>Phase 2<span class="crumb-more">: DBVO Patching</span></span></button>
        <span class="crumb-sep">›</span>
        <button class="crumb" data-section="fomods" title="Build the installer (FOMOD) for your voice pack"><span class="num">3</span><span>Phase 3<span class="crumb-more">: FOMOD Creation</span></span></button>
        <button class="crumb tool-crumb active hidden" id="tool-crumb" title="The tool you are in (Other Tools)"></button>
      </nav>
      <div style="flex:1"></div>
      <div id="job" class="job hidden">
        <div class="job-label"></div>
        <div class="bar"><div class="bar-fill"></div></div>
        <button class="btn sm ghost" id="job-cancel" title="Stop the running task; work finished so far is kept">Cancel</button>
      </div>
      <button class="top-btn" id="tools-btn" data-section="tools" title="WAV to LIP, NPC Revoice, Voiced Books and Player Grunts">Other Tools ▾</button>
      <button class="top-btn" data-section="help" title="The user guide (F1)">? Guide</button>
      <button class="top-btn" data-section="settings" title="Library, tools, keys, appearance and voice packs">⚙ Global Settings</button>
    </header>
    <main id="main"></main>
  </div>
  <div id="toast" class="toast hidden"></div>
  <div id="modal" class="modal hidden"><div class="modal-card"></div></div>
  <script type="module" src="app.js"></script>
</body>
</html>
