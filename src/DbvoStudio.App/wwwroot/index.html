<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DBVO Voice Pack Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="top">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <div class="brand-name">DBVO Studio</div>
      </div>
      <nav class="crumbs">
        <button class="crumb" data-section="mods"><span class="num">1</span>Phase 1: Import Mods</button>
        <span class="crumb-sep">›</span>
        <button class="crumb" data-section="patches"><span class="num">2</span>Phase 2: DBVO Patching</button>
        <span class="crumb-sep">›</span>
        <button class="crumb" data-section="fomods"><span class="num">3</span>Phase 3: FOMOD Creation</button>
      </nav>
      <div style="flex:1"></div>
      <div id="job" class="job hidden">
        <div class="job-label"></div>
        <div class="bar"><div class="bar-fill"></div></div>
        <button class="btn sm ghost" id="job-cancel">Cancel</button>
      </div>
      <button class="top-btn" id="tools-btn" data-section="tools">Other Tools ▾</button>
      <button class="top-btn" data-section="settings">⚙ Global Settings</button>
    </header>
    <main id="main"></main>
  </div>
  <div id="toast" class="toast hidden"></div>
  <div id="modal" class="modal hidden"><div class="modal-card"></div></div>
  <script type="module" src="app.js"></script>
</body>
</html>
