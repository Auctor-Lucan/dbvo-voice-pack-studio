<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DBVO Voice Pack Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <nav id="nav">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <div>
          <div class="brand-name">DBVO Studio</div>
          <div class="brand-sub">Voice Pack Studio</div>
        </div>
      </div>
      <button class="nav-item" data-view="mods"><span class="n-ico">①</span>Mods</button>
      <button class="nav-item" data-view="patches"><span class="n-ico">②</span>DBVO Patches</button>
      <button class="nav-item" data-view="voices"><span class="n-ico">◐</span>Voice packs</button>
      <button class="nav-item" data-view="settings"><span class="n-ico">⚙</span>Settings</button>
      <div class="nav-fill"></div>
      <div id="job" class="job hidden">
        <div class="job-label"></div>
        <div class="bar"><div class="bar-fill"></div></div>
        <button class="btn sm ghost" id="job-cancel">Cancel</button>
      </div>
    </nav>
    <main id="main"></main>
  </div>
  <div id="toast" class="toast hidden"></div>
  <div id="modal" class="modal hidden"><div class="modal-card"></div></div>
  <script type="module" src="app.js"></script>
</body>
</html>
